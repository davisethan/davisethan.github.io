version: "0.2"
language: en-US

files:
  - "**/*.md"

ignorePaths:
  - _site/**
  - node_modules/**
  - assets/**

dictionaries:
  - softwareTerms
  - companies

# Ignore bare URLs and markdown link targets
ignoreRegExpList:
  - "https?://[^\\s)\"']+"
  - "\\]\\(#?[^)]*\\)"

words:
  # --- Machine learning and statistics ---
  - eigendecomposition
  - eigenface
  - eigenfaces
  - frequentist
  - MCMC
  - metaheuristic
  - Riemannian

  # --- Neuroscience and BCI ---
  - MOABB
  - SPANER

  # --- Computing and hardware ---
  - CUDA
  - lifecycles

  # --- Publishers and repositories ---
  - figshare
  - Zenodo

  # --- This project ---
  - davisethan
  - moabbr
  - Cayman
  - cspell
  - proofer
  - htmlproofer
  - textlint
